<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c0e0e">
  <title>湯ノ沢まで</title>
  <meta name="description" content="雨の山道を、コマ図をたよりに走るドライブゲーム。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <!-- 読み込み中 -->
  <div id="loading" class="screen">
    <div class="load-box">
      <div class="eyebrow">LOADING</div>
      <div id="load-text">山を作っています</div>
      <div class="bar"><span id="load-bar"></span></div>
    </div>
  </div>

  <!-- タイトル -->
  <div id="title" class="screen hidden">
    <div class="title-block">
      <div class="eyebrow">コマ図 No. 3</div>
      <h1>湯ノ沢まで</h1>
      <div class="sub">雨の峠道 · 約 4.7 km</div>
      <nav class="menu" id="title-menu">
        <button data-go="start"><span class="k">1</span>走り出す</button>
        <button data-go="settings"><span class="k">2</span>設定</button>
        <button data-go="help"><span class="k">3</span>操作</button>
        <button data-go="credits"><span class="k">4</span>クレジット</button>
      </nav>
    </div>
    <div class="corner">試作 0.1</div>
  </div>

  <!-- 一時停止 -->
  <div id="pause" class="screen hidden dim">
    <div class="title-block">
      <div class="eyebrow">一時停止</div>
      <nav class="menu" id="pause-menu">
        <button data-go="resume"><span class="k">Esc</span>続ける</button>
        <button data-go="respawn"><span class="k"></span>少し手前からやり直す</button>
        <button data-go="settings"><span class="k"></span>設定</button>
        <button data-go="help"><span class="k"></span>操作</button>
        <button data-go="quit"><span class="k"></span>タイトルへ</button>
      </nav>
    </div>
  </div>

  <!-- 設定・操作・クレジット(共通のパネル) -->
  <div id="panel" class="panel hidden">
    <div class="panel-head"><span id="panel-title"></span><button id="panel-close">閉じる</button></div>
    <div id="panel-body"></div>
  </div>

  <!-- 運転中の表示 -->
  <div id="hud" class="hidden">
    <div id="readout"></div>
    <div id="hint"></div>
    <div id="msg"></div>
    <div id="komazu-hint"></div>
    <div id="keys-tag"><b>Tab</b>操作</div>
    <div id="keys-card" class="hidden"></div>
  </div>

  <!-- スマホの操作 -->
  <div id="touch" class="hidden">
    <div class="t-top">
      <button data-a="engine">エンジン</button>
      <button data-a="lights">ライト</button>
      <button data-a="wiper">ワイパー</button>
      <button data-a="defrost">曇り止め</button>
      <button data-a="room">室内灯</button>
      <button data-a="view">視点</button>
      <button data-a="keys">操作</button>
      <button data-a="pause">≡</button>
    </div>
    <button class="t-komazu" data-a="komazu">コマ図</button>
    <div class="t-steer" data-t="steer"><div class="track"></div><div class="thumb"></div></div>
    <div class="t-right">
      <div class="t-lever">
        <button data-a="leverUp">▲</button>
        <div id="t-gear">P</div>
        <button data-a="leverDown">▼</button>
      </div>
      <div class="t-pedal brake" data-t="brake"><span>ブレーキ</span></div>
      <div class="t-pedal gas" data-t="gas"><span>アクセル</span></div>
    </div>
  </div>

  <!-- 到着 -->
  <div id="ending" class="screen hidden">
    <div class="end-block">
      <div class="eyebrow">到着</div>
      <h2>湯ノ沢</h2>
      <div id="end-stats"></div>
      <nav class="menu"><button data-go="title"><span class="k">Enter</span>タイトルへ</button></nav>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
